<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Учебная форма авторизации NOVA SPACE" />
    <title>ПЗ 29 — NOVA SPACE</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./scripts/app.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="auth">
        <div class="auth__top">
          <div class="brand brand--mobile">
            <span class="brand__mark">N</span><span>NOVA SPACE</span>
          </div>
        </div>
        <section class="auth-card">
          <span class="auth-card__mark">N</span>
          <h1 class="auth-card__title">С возвращением!</h1>
          <p class="auth-card__intro">Войдите в аккаунт NOVA SPACE чтобы продолжить работу</p>

          <form id="login-form" class="auth-form" novalidate>
            <div class="field">
              <label class="field__label" for="email">Электронная почта</label>
              <input
                class="field__input"
                id="email"
                name="email"
                type="email"
                placeholder="student@example.com"
                required
                aria-describedby="email-error"
                aria-invalid="false"
              />
              <p class="field__error" id="email-error"></p>
            </div>

            <div class="field">
              <label class="field__label" for="password">Пароль</label>
              <input
                class="field__input"
                id="password"
                name="password"
                type="password"
                placeholder="Минимум 8 символов"
                required
                minlength="8"
                aria-describedby="password-error"
                aria-invalid="false"
              />
              <p class="field__error" id="password-error"></p>
            </div>

            <button class="submit-button" type="submit">Войти в аккаунт</button>

            <p class="form-status" id="form-status"></p>
          </form>

          <p class="auth-card__note">Учебная форма. Реальной авторизации нет</p>
        </section>
      </main>
    </div>
  </body>
</html>
